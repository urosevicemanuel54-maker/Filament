name: iOS IPA

# Builds Filament for a real device and publishes the .ipa as a release asset,
# so the download link is stable and public:
#
#   https://github.com/<owner>/Filament/releases/download/latest-build/Filament-unsigned.ipa
#
# Without signing secrets the IPA is unsigned — re-sign it with your own Apple
# ID on the device side (Sideloadly, AltStore, ESign). With signing secrets it
# exports a signed IPA instead (see README).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Filament
  PROJECT: Filament.xcodeproj
  SCHEME: Filament
  RELEASE_TAG: latest-build
  # Secrets cannot be read in `if:`, so resolve their presence once here.
  HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/filament-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup component add clippy rustfmt

      - name: Test (the recorded cases)
        run: cargo test --all-targets

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        continue-on-error: true
        run: cargo fmt --check

  ipa:
    name: Build IPA
    runs-on: macos-26
    needs: rust-core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Import signing assets
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/build_certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          set -euo pipefail
          METHOD="${EXPORT_METHOD:-ad-hoc}"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

          cp build/export/*.ipa "$APP_NAME.ipa"
          ls -lh "$APP_NAME.ipa"

      - name: Build unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/$APP_NAME.app" Payload/
          zip -qry "$APP_NAME-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "$APP_NAME-unsigned.ipa"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filament-ipa
          path: |
            Filament.ipa
            Filament-unsigned.ipa

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=""
          for f in "$APP_NAME.ipa" "$APP_NAME-unsigned.ipa"; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          [ -n "$FILES" ] || { echo "::error::No IPA was produced"; exit 1; }

          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "Latest build" \
                 --notes "Filament built from ${GITHUB_SHA} by GitHub Actions." \
                 --target "$GITHUB_SHA"

          # shellcheck disable=SC2086
          gh release upload "$RELEASE_TAG" $FILES --clobber

          {
            echo "## Download"
            for f in $FILES; do
              echo "- https://github.com/${REPO}/releases/download/${RELEASE_TAG}/$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
