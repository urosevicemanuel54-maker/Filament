[package]
name = "filament-core"
version = "0.1.0"
edition = "2021"
description = "Filament's fast Instagram JSON mapping core"
license = "GPL-3.0-or-later"

[lib]
name = "filament_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
